name: Auto Stock Screener

on:
  schedule:
    # 1시간마다 실행 (크론 스케줄: 매시 0분)
    - cron: '0 * * * *'
  # 수동 실행 버튼 활성화
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4

    - name: 파이썬 3.10 설치
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 의존성 라이브러리 직접 설치
      run: |
        python -m pip install --upgrade pip
        pip install finance-datareader pandas numpy tqdm

    - name: 스크리너 파이썬 코드 실행
      run: python screener.py

    - name: 변경사항 GitHub에 자동 커밋 및 푸시
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add public/
        git commit -m "Auto update screening results [skip ci]" || exit 0
        git push

